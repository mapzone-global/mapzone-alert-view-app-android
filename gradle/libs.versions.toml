[versions]
agp = "9.2.1"
coreKtx = "1.18.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
appcompat = "1.7.1"
material = "1.14.0"
kotlin = "2.2.10"
composeBom = "2026.02.01"
activityCompose = "1.13.0"
lifecycleRuntimeKtx = "2.10.0"
lifecycleViewmodelCompose = "2.10.0"
datastorePreferences = "1.1.1"
coroutines = "1.9.0"
constraintLayout = "2.2.0"
gson = "2.10.1"
okhttp = "4.12.0"
retrofit = "2.11.0"
vietmapMapsSdk = "4.1.1"
vietmapNavigation = "2.6.5"
vietmapServicesCore = "1.0.0"
vietmapServicesDirections = "1.0.1"
vietmapServicesTurf = "1.0.2"
vietmapServices = "1.1.2"
vietmapServicesGeojson = "1.0.0"
alertViewSdk = "0.0.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }

# Jetpack Compose
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleViewmodelCompose" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastorePreferences" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintLayout" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# Networking (search API)
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-converter-gson = { group = "com.squareup.retrofit2", name = "converter-gson", version.ref = "retrofit" }

# Vietmap Maps + Navigation SDK (Approach B — GPS snapped to the route)
vietmap-maps-sdk = { group = "com.github.vietmap-company", name = "maps-sdk-android", version.ref = "vietmapMapsSdk" }
vietmap-navigation = { group = "com.github.vietmap-company", name = "maps-sdk-navigation-android", version.ref = "vietmapNavigation" }
vietmap-navigation-ui = { group = "com.github.vietmap-company", name = "maps-sdk-navigation-ui-android", version.ref = "vietmapNavigation" }
vietmap-services-core = { group = "com.github.vietmap-company", name = "vietmap-services-core", version.ref = "vietmapServicesCore" }
vietmap-services-directions-models = { group = "com.github.vietmap-company", name = "vietmap-services-directions-models", version.ref = "vietmapServicesDirections" }
vietmap-services-turf = { group = "com.github.vietmap-company", name = "vietmap-services-turf-android", version.ref = "vietmapServicesTurf" }
vietmap-services = { group = "com.github.vietmap-company", name = "vietmap-services-android", version.ref = "vietmapServices" }
vietmap-services-geojson = { group = "com.github.vietmap-company", name = "vietmap-services-geojson-android", version.ref = "vietmapServicesGeojson" }
mapzone-alert-view-android = { group = "com.github.mapzone-global", name = "mapzone-alert-view-android", version.ref = "alertViewSdk" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
